name: Lint Rules

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the rule detectors
        run: python3 -m unittest backend.test_lint_rules
      - name: Check repository rules
        run: python3 scripts/lint_rules.py --report
